  <text x="218" y="296" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="14" fill="#d8dee9" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#d8dee9">git reset --soft HEAD~1</tspan></text>
  <text x="204" y="348" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="10.5" fill="#4b5263" font-weight="700" xml:space="preserve">WHY</text>
  <text x="204" y="370" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="12" fill="#8b93a7" xml:space="preserve">--soft moves the branch pointer back one commit and leaves every change in</text>
