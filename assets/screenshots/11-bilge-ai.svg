  <text x="218" y="208" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="13" fill="#d8dee9" xml:space="preserve">undo my last commit but keep the changes staged</text>
  <text x="204" y="258" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="10.5" fill="#4b5263" font-weight="700" xml:space="preserve">SUGGESTED COMMAND</text>
