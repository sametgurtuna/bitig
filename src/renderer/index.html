<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <title>Bitig</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Arkaplan gorseli (varsa) tum pencerenin arkasinda, #app'in disinda
         durur; #app'in kendi arkaplani opaklik ayarina gore yari saydam
         hale geldiginde bu katman altindan gorunur. -->
    <div id="bg-image"></div>
    <div id="app">
      <header id="titlebar">
        <div id="titlebar-drag">
          <span id="titlebar-label">Bitig</span>
          <div id="tabbar-list" role="tablist"></div>
          <button id="new-tab-btn" title="Yeni sekme (Ctrl+Shift+T)" aria-label="Yeni sekme">
            <svg viewBox="0 0 10 10"><path d="M5 0v10M0 5h10" /></svg>
          </button>
        </div>
        <button id="settings-btn" title="Gorunum ayarlari" aria-label="Ayarlari ac">
          <svg viewBox="0 0 10 10" id="settings-btn-icon">
            <line x1="0" y1="2" x2="10" y2="2" />
            <circle cx="6.5" cy="2" r="1.1" />
            <line x1="0" y1="5" x2="10" y2="5" />
            <circle cx="3.5" cy="5" r="1.1" />
            <line x1="0" y1="8" x2="10" y2="8" />
            <circle cx="7" cy="8" r="1.1" />
          </svg>
        </button>
        <div id="titlebar-controls">
          <button id="btn-minimize" class="titlebar-btn" title="Kucult" aria-label="Kucult">
            <svg viewBox="0 0 10 10"><path d="M0 5h10" /></svg>
          </button>
          <button
            id="btn-maximize"
            class="titlebar-btn"
            title="Buyut/Geri yukle"
            aria-label="Buyut"
          >
            <svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" /></svg>
          </button>
          <button id="btn-close" class="titlebar-btn titlebar-btn-close" title="Kapat" aria-label="Kapat">
            <svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" /></svg>
          </button>
        </div>
      </header>
      <div id="terminal-shell">
        <div id="terminal-root"></div>
      </div>
      <div id="settings-panel" class="hidden"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
