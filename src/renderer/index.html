<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <title>Bitig</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Arkaplan gorseli (varsa) tum pencereyi kaplar ama #app'in
           icindedir: boylece #app'in border-radius + overflow:hidden
           kirpmasina uyar, yuvarlak koselerin disina tasmaz. Uzerindeki
           katmanlar (title bar, terminal, ayarlar) opaklik ayarina gore
           yari saydam boyandiginda bu katman altlarindan gorunur. -->
      <div id="bg-image"></div>
      <header id="titlebar">
        <div id="titlebar-drag">
          <span id="titlebar-label">Bitig</span>
          <div id="tabbar-list" role="tablist"></div>
          <div id="new-tab-group">
            <button id="new-tab-btn" title="New tab (Ctrl+Shift+T)" aria-label="New tab">
              <svg viewBox="0 0 10 10"><path d="M5 0v10M0 5h10" /></svg>
            </button>
            <button id="new-tab-dropdown-btn" title="Choose shell profile..." aria-label="Choose shell profile">
              <svg viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <div id="profile-dropdown-menu" class="profile-dropdown-menu hidden"></div>
          </div>
        </div>
        <button id="settings-btn" title="Appearance settings" aria-label="Open settings">
          <svg viewBox="0 0 10 10" id="settings-btn-icon">
            <line x1="0" y1="2" x2="10" y2="2" />
            <circle cx="6.5" cy="2" r="1.1" />
            <line x1="0" y1="5" x2="10" y2="5" />
            <circle cx="3.5" cy="5" r="1.1" />
            <line x1="0" y1="8" x2="10" y2="8" />
            <circle cx="7" cy="8" r="1.1" />
          </svg>
        </button>
        <div id="titlebar-controls">
          <button id="btn-minimize" class="titlebar-btn" title="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 10 10"><path d="M0 5h10" /></svg>
          </button>
          <button
            id="btn-maximize"
            class="titlebar-btn"
            title="Maximize/Restore"
            aria-label="Maximize"
          >
            <svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" /></svg>
          </button>
          <button id="btn-close" class="titlebar-btn titlebar-btn-close" title="Close" aria-label="Close">
            <svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" /></svg>
          </button>
        </div>
      </header>
      <div id="terminal-shell">
        <div id="terminal-root"></div>
      </div>
      <div id="settings-panel" class="hidden"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
